repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: '\.(glsl|frag|vert|cu|cuh|cc|cpp|hpp|h|c|cxx|hxx|rchit|rgen|rmiss|comp|proto|hlsl|hlsli|m|mm)$'
        types_or: ['text']
        args: ['--style=file']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
