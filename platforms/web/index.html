<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LongMarch Web</title>
<style>
  :root { --bg: #141414; --bar: rgba(30, 32, 36, 0.72); --text: #e8eaed; --muted: #9aa1ac; --accent: #4f8fe6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 1;
    display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--bar);
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 0 0 0.5px rgba(255, 255, 255, 0.12); }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  nav a[aria-current] { color: var(--text); background: rgba(255, 255, 255, 0.14); }
  #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }
  #status[hidden] { display: none; }
  #status p { max-width: 420px; margin: 0; }
</style>
</head>
<body>
<nav id="apps"></nav>
<canvas id="canvas" tabindex="0"></canvas>
<div id="status"><p id="message"></p></div>
<script>
  const zh = navigator.language.toLowerCase().startsWith('zh');
  const text = zh
    ? { gol: '生命游戏', '2048': '2048', nbody: 'N 体模拟', loading: '正在加载…',
        unsupported: '这个浏览器不支持 WebGPU。请使用最新版的 Chrome、Edge 或 Safari 26。', failed: '运行出错：' }
    : { gol: 'Game of Life', '2048': '2048', nbody: 'N-body', loading: 'Loading…',
        unsupported: 'This browser does not support WebGPU. Use a current Chrome, Edge or Safari 26.', failed: 'Error: ' };
  const apps = ['gol', '2048', 'nbody'];
  const app = apps.includes(new URLSearchParams(location.search).get('app')) ?
    new URLSearchParams(location.search).get('app') : 'gol';
  document.documentElement.lang = zh ? 'zh-CN' : 'en';
  document.title = text[app] + ' · LongMarch';
  const nav = document.getElementById('apps');
  for (const id of apps) {
    const link = document.createElement('a');
    link.href = '?app=' + id;
    link.textContent = text[id];
    if (id === app) link.setAttribute('aria-current', 'page');
    nav.appendChild(link);
  }
  const status = document.getElementById('status');
  const message = document.getElementById('message');
  const show = (value) => { message.textContent = value; status.hidden = false; };
  show(text.loading);
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());
  if (!navigator.gpu) {
    show(text.unsupported);
  } else {
    window.Module = {
      arguments: [app],
      canvas,
      onLongMarchReady: () => { status.hidden = true; canvas.focus(); },
      onLongMarchError: (error) => show(text.failed + error),
      printErr: (line) => console.error(line),
    };
    const script = document.createElement('script');
    script.src = 'longmarch.js';
    document.body.appendChild(script);
  }
</script>
</body>
</html>
